data_dir: "data"

# ── Spectral sensing boards (serial connection to ESP32 PCBs) ─────────────────
PCBs:
  # COM ports remapped 2026-07-14 after USB hub install (CH340 adapters have
  # no serial numbers, so Windows renumbers them when the USB topology
  # changes). Identified by serial probing: board-1 confirmed by its NTC
  # probes (~27 C; other boards read open-circuit). Boards 2/3/4 assigned by
  # hub port order (board-1 was on hub port 1) — if station labels look
  # swapped, exchange the ports of board-2/board-3 here.
  - board_id: "board-1"
    enabled: true                # false = board not connected/in use; skipped by the web GUI
    com_port: "COM5"
    sensors_in_use: 16           # 1..16
    sensor_settings:
      gain: 64                    # 1,2,4,8
      atime: 255                  # 0..255
      astep: 600                  # 0..65535
    sample_type: "liquid"        # "solid" or "liquid" (solid => LEDs_ON true)
    control_voltage: 9.0         # 0..10, applied only during run()
    target_temp_c: 40          # float e.g. 37.0 enables firmware PID; null = heaters off
    max_power_%: 20               # float % power (KEEP LOW)
    sensor_pin: 5                 # NTC sensor pin input (1, 2, 4 or 5)

  - board_id: "board-2"
    enabled: true
    com_port: "COM7"            # hub port 2 (see remap note above)
    sensors_in_use: 16
    sensor_settings:
      gain: 64
      atime: 255
      astep: 600
    sample_type: "liquid"
    control_voltage: 9.0
    target_temp_c: null
    max_power_%: 20     
    sensor_pin: 5

  - board_id: "board-3"
    enabled: true
    com_port: "COM8"            # hub port 3 (see remap note above)
    sensors_in_use: 16
    sensor_settings:
      gain: 64
      atime: 255
      astep: 600
    sample_type: "liquid"
    control_voltage: 9.0
    target_temp_c: null
    max_power_%: 20
    sensor_pin: 5

  - board_id: "board-4"
    enabled: false               # not installed at a station
    com_port: "COM14"           # spectral board on hub port 4 (probes absent)
    sensors_in_use: 16
    sensor_settings:
      gain: 64
      atime: 255
      astep: 600
    sample_type: "liquid"
    control_voltage: 9.0
    target_temp_c: null
    max_power_%: 20
    sensor_pin: 5

  - board_id: "board-5"
    enabled: false               # not installed
    com_port: "COM15"
    sensors_in_use: 16
    sensor_settings:
      gain: 64
      atime: 255
      astep: 600
    sample_type: "liquid"
    control_voltage: 9.0
    target_temp_c: null
    max_power_%: 20
    sensor_pin: 5

# ── N9 Robot ──────────────────────────────────────────────────────────────────
robot:
  simulate: false                 # true = log moves only, no hardware calls
  safe_travel_z_mm: 200.0         # Z height used for all XY travel moves
  device_serial: "FT5SJ5LG"      # bare FTDI chip serial number; null = first found
  home_interval: 6               # home every N place_at() calls (1 = after every move)
  # velocity: 30000               # encoder counts/s  (omit to use default 10000)
  # acceleration: 300000          # encoder counts/s² (omit to use default 200000)

# ── PCB sensing boards in the robot workspace ─────────────────────────────────
# Each PCB has a 2-column × 8-row grid of sensor wells (16 total).
# Sensor numbering: odd (1,3,...,15) → col 0; even (2,4,...,16) → col 1.
# origin_xyz: robot coords (mm) of well (col=0, row=0) = sensor 1.
# Add one entry per physical PCB installed in the workspace.
sensing_stations:
  - id: "sensing-station-1"
    board_id: "board-1"          # cross-reference to boards[] entry above
    origin_xyz: [171.9, 256.75, 52.0]
    col_spacing_mm: 31.2         # spacing between the 2 columns
    row_spacing_mm: -15.0         # spacing between the 8 rows
    pick_z_mm: 52.0               # Z (mm) to descend to for pick/place
    pipette_dispense_z_mm: 30.0  # Z (mm) for pipette tip above sensor well during liquid dispense

  - id: "sensing-station-2"
    board_id: "board-2"
    origin_xyz: [96.9, 294.75, 52.0]  # placeholder — calibrate before use
    col_spacing_mm: 31.2
    row_spacing_mm: -15.0
    pick_z_mm: 52.0
    pipette_dispense_z_mm: 30.0

  - id: "sensing-station-3"
    board_id: "board-3"
    origin_xyz: [21.9, 256.75, 52.0]  # placeholder
    col_spacing_mm: 31.2
    row_spacing_mm: -15.0
    pick_z_mm: 52.0
    pipette_dispense_z_mm: 30.0

  - id: "sensing-station-4"
    board_id: "board-4"
    origin_xyz: [0.0, 0.0, 52.0]  # placeholder
    col_spacing_mm: 31.2
    row_spacing_mm: -15.0
    pick_z_mm: 52.0
    pipette_dispense_z_mm: 30.0

  - id: "sensing-station-5"
    board_id: "board-5"
    origin_xyz: [0.0, 0.0, 52.0]  # placeholder
    col_spacing_mm: 31.2
    row_spacing_mm: -15.0
    pick_z_mm: 52.0
    pipette_dispense_z_mm: 30.0

# ── Sample holders ────────────────────────────────────────────────────────────
# Each holder has a 5-column × 18-row grid (90 slots total).
# origin_xyz: robot coords (mm) of slot (col=0, row=0).
# Add one entry per physical holder installed in the workspace.
sample_holders:
  - holder_id: "holder-1"
    origin_xyz: [183.25, 67.62, 52.0]
    col_spacing_mm: 11.5         # spacing between the 5 columns
    row_spacing_mm: -5.75         # spacing between the 18 rows
    n_cols: 5
    n_rows: 18
    pick_z_mm: 40.0               # Z (mm) to descend to for pick/place

  - holder_id: "holder-2"
    origin_xyz: [108.25, 67.62, 52.0]  # placeholder — calibrate before use
    col_spacing_mm: 11.5
    row_spacing_mm: -5.75
    n_cols: 5
    n_rows: 18
    pick_z_mm: 40.0

  - holder_id: "holder-3"
    origin_xyz: [183.25, -82.38, 52.0]  # placeholder
    col_spacing_mm: 11.5
    row_spacing_mm: -5.75
    n_cols: 5
    n_rows: 18
    pick_z_mm: 40.0

# ── Legacy sample rack (large white rack from legacy C9 setup) ────────────────
# One configurable-origin grid of 11 cols × 8 rows at Z = 44 mm.
# col_spacing_mm is negative because X decreases with increasing column index.
# Move the rack by changing origin_xyz only — spacing and dims stay fixed.
legacy_sample_racks:
  - rack_id: "legacy-rack-1"
    origin_xyz: [-99.91, -33.25, 44.0]   # XYZ of slot (col=0, row=0); adjust to physical location
    col_spacing_mm: -25.5                 # X decreases with col (legacy layout)
    row_spacing_mm: 15.5                  # Y increases with row
    n_cols: 9
    n_rows: 8
    pick_z_mm: 44.0                       # height for pick/place (matches legacy Z)

# ── Peristaltic pumps ─────────────────────────────────────────────────────────
# Only the 4 pumps in use. Calibration stays with the physical pump (index).
# Volume model: volume_ml = flow_rate_ml_per_s * time_s + offset_ml
# → run time = (volume_ml - offset_ml) / flow_rate_ml_per_s
# Renamed 2026-07-13: idx 12 KOH (was H2O_ECELL), idx 14 H2O_ECELL (was
# H2O_VIAL), idx 16 HCl_ECELL (was Air).
peristaltic_pumps:
  Drain:       { index: 13, flow_rate_ml_per_s: 2.2326,  offset_ml:  0.0    }
  KOH:         { index: 12, flow_rate_ml_per_s: 0.7518,  offset_ml: -0.2341 }
  H2O_ECELL:   { index: 14, flow_rate_ml_per_s: 0.6104,  offset_ml:  0.0638 }
  HCl_ECELL:   { index: 16, flow_rate_ml_per_s: 0.6,     offset_ml:  0.1    }

# ── Fluidic pump controller (ESP32 stepper pump PCB) ─────────────────────────
# Controls 4 stepper pumps for dye mixing and dispensing via robot end effector.
fluidic_pump_controller:
  com_port: "COM11"              # remapped 2026-07-14 (USB hub); confirmed by getHumidity() probe
  simulate: false
  baud: 115200
  timeout: 60.0
  invert_pumps: [3]              # stepper pumps wired with reversed rotation (dye 1); volumes are sign-flipped in software
  pipette_offset_mm: 60.0        # gripper-to-pipette-tip distance along last link, XY plane
  pipette_x_correction_mm: -0.5  # fixed X position correction for PCB pipette targets (mm)
  pipette_y_correction_mm: 2.5  # fixed Y position correction for PCB pipette targets (mm)
  mixture:
    water_pump_index: 2
    dye1_pump_index: 3
    dye2_pump_index: 4
    dose_pump_index: 1
    prime_volume_ml: 1.0        # volume to prime/flush the dose line
    dose_volume_ml: 0.2         # fixed per-well dispense volume
    flow_rate: 0.04             # ml/s for all stepper pump calls
    waste_xyz: [-250.0, 0.0, 50.0] # placeholder — robot XYZ for pipette priming over waste

# ── Test cell ─────────────────────────────────────────────────────────────────
# Single-sample electrochemical station. Holds one sample at a time.
# Robot position is XYZ (mm) — arm travels to this point with gripper holding sample.
# Insert procedure: move to xyz → engage piston → open gripper → home
#                   → fill (H2O_ECELL pump) → drain (Drain pump)
test_cell:
  xyz: [346.0, -56.25, 105]                       # robot XYZ (mm) for sample insertion/test position
  safe_travel_z_mm: 200.0                      # Z (mm) to raise to before/after test cell moves
  # Digital output index (from legacy params.py ECELL_INDICES)
  piston_output_index: 2                       # hydraulic piston (on = engage/clamp)
  # Fill/drain pumps (from peristaltic_pumps section above)
  fill_pump: "H2O_ECELL"                      # pump used to fill the test cell (idx 14, was named H2O_VIAL)
  drain_pump: "Drain"                          # pump used to drain the test cell
  fill_volume_ml: 0                            # ECELL_VOLUME from legacy
  gripper_angle: 90                            # degrees; extra gripper rotation for test cell XY moves only

# ── Web GUI (n9-web) ──────────────────────────────────────────────────────────
web:
  host: 127.0.0.1
  port: 8000
  # Allowed envelope for raw XYZ moves from the GUI (mm). Grid-based moves are
  # validated against the layouts above instead. Calibrate to the real workspace.
  workspace_limits:
    x: [-260.0, 360.0]
    y: [-110.0, 310.0]
    z: [20.0, 210.0]
  # Directory scanned for experiment YAML files offered in the GUI
  experiments_dir: "experiment-database"
  # Safety caps for manual pump operations from the GUI (mL)
  max_manual_volume_ml: 25.0
