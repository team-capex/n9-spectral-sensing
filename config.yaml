data_dir: "data"

# ── Spectral sensing boards (serial connection to ESP32 PCBs) ─────────────────
PCBs:
  - board_id: "board-1"
    com_port: "COM11"
    sensors_in_use: 16           # 1..16
    sensor_settings:
      gain: 64                    # 1,2,4,8
      atime: 255                  # 0..255
      astep: 600                  # 0..65535
    sample_type: "liquid"        # "solid" or "liquid" (solid => LEDs_ON true)
    control_voltage: 9.0         # 0..10, applied only during run()
    target_temp_c: null          # float e.g. 37.0 enables firmware PID; null = heaters off

  - board_id: "board-2"
    com_port: "COM6"            # placeholder — update to actual port
    sensors_in_use: 16
    sensor_settings:
      gain: 64
      atime: 255
      astep: 600
    sample_type: "liquid"
    control_voltage: 9.0
    target_temp_c: null

  - board_id: "board-3"
    com_port: "COM12"            # placeholder
    sensors_in_use: 16
    sensor_settings:
      gain: 64
      atime: 255
      astep: 600
    sample_type: "liquid"
    control_voltage: 9.0
    target_temp_c: null

  - board_id: "board-4"
    com_port: "COM14"            # placeholder
