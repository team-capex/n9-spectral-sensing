data_dir: "data"

# ── Spectral sensing boards (serial connection to ESP32 PCBs) ─────────────────
PCBs:
  - board_id: "board-1"
    com_port: "/dev/cu.wchusbserial110"
    sensors_in_use: 16           # 1..16
    sensor_settings:
      gain: 64                    # 1,2,4,8
      atime: 255                  # 0..255
      astep: 600                  # 0..65535
    sample_type: "liquid"        # "solid" or "liquid" (solid => LEDs_ON true)
    control_voltage: 9.0         # 0..10, applied only during run()
    target_temp_c: null          # float e.g. 37.0 enables firmware PID; null = heaters off

# ── N9 Robot ──────────────────────────────────────────────────────────────────
robot:
  simulate: false                 # true = log moves only, no hardware calls
  safe_travel_z_mm: 80.0         # Z height used for all XY travel moves
  device_serial: "FT5SJ5LG"    # bare FTDI chip serial number; null = first found

# ── Liquid dispenser (hardware TBD) ───────────────────────────────────────────
# Replace this section once dispenser hardware is defined.
dispenser:
  simulate: true                 # true = log actions only; non-simulate raises NotImplementedError
  volume_per_dispense_ul: 5.0   # placeholder dispensed volume per well

# ── PCB sensing boards in the robot workspace ─────────────────────────────────
# Each PCB has a 2-column × 8-row grid of sensor wells (16 total).
# Sensor numbering: odd (1,3,...,15) → col 0; even (2,4,...,16) → col 1.
# origin_xyz: robot coords (mm) of well (col=0, row=0) = sensor 1.
# Add one entry per physical PCB installed in the workspace.
sensing_stations:
  - id: "sensing-station-1"
    board_id: "board-1"          # cross-reference to boards[] entry above
    origin_xyz: [100.0, 50.0, 50.0]
    col_spacing_mm: 30.0         # spacing between the 2 columns
    row_spacing_mm: 15.0         # spacing between the 8 rows
    pick_z_mm: 50.0               # Z (mm) to descend to for pick/place on this PCB
    dispense_z_mm: 8.0           # Z (mm) for dispenser nozzle above sensor well

# ── Sample holders ────────────────────────────────────────────────────────────
# Each holder has a 5-column × 18-row grid (90 slots total).
# origin_xyz: robot coords (mm) of slot (col=0, row=0).
# Add one entry per physical holder installed in the workspace.
sample_holders:
  - holder_id: "holder-1"
    origin_xyz: [300.0, 50.0, 5.0]
    col_spacing_mm: 11.5         # spacing between the 5 columns
    row_spacing_mm: 5.75         # spacing between the 18 rows
    n_cols: 5
    n_rows: 18
    pick_z_mm: 2.0               # Z (mm) to descend to for pick/place

# ── Legacy sample rack (large white rack from legacy C9 setup) ────────────────
# One configurable-origin grid of 11 cols × 8 rows at Z = 44 mm.
# col_spacing_mm is negative because X decreases with increasing column index.
# Move the rack by changing origin_xyz only — spacing and dims stay fixed.
legacy_sample_racks:
  - rack_id: "legacy-rack-1"
    origin_xyz: [-74.41, 41.75, 44.0]   # XYZ of slot (col=0, row=0); adjust to physical location
    col_spacing_mm: -25.5                 # X decreases with col (legacy layout)
    row_spacing_mm: 15.5                  # Y increases with row
    n_cols: 11
    n_rows: 8
    pick_z_mm: 44.0                       # height for pick/place (matches legacy Z)

# ── Peristaltic pumps ─────────────────────────────────────────────────────────
# Indices and calibration from legacy C9 system (params.py).
# Volume model: volume_ml = flow_rate_ml_per_s * time_s + offset_ml
# → run time = (volume_ml - offset_ml) / flow_rate_ml_per_s
peristaltic_pumps:
  Drain:       { index: 12, flow_rate_ml_per_s: 2.2326,  offset_ml:  0.0    }
  KOH:         { index: 13, flow_rate_ml_per_s: 0.3363,  offset_ml:  0.0626 }
  H2O_ECELL:   { index: 14, flow_rate_ml_per_s: 0.7518,  offset_ml: -0.2341 }
  H2O:         { index: 15, flow_rate_ml_per_s: 0.6104,  offset_ml:  0.0638 }
  Air:         { index: 16, flow_rate_ml_per_s: 0.6,     offset_ml:  0.1    }
  HCl_ECELL:   { index: 17, flow_rate_ml_per_s: 0.3555,  offset_ml: -0.0795 }
  H2O_suction: { index: 18, flow_rate_ml_per_s: 0.6,     offset_ml:  0.1    }
  HCl:         { index: 19, flow_rate_ml_per_s: 0.6,     offset_ml:  0.1    }
  NaOH:        { index: 20, flow_rate_ml_per_s: 0.4474,  offset_ml:  0.0702 }

# ── Test cell ─────────────────────────────────────────────────────────────────
# Single-sample electrochemical station. Holds one sample at a time.
# Robot positions are encoder counts [gripper, elbow, shoulder, z_axis] — use robot.goto().
# Legacy positions from locator.py (heights may be re-tuned on the new setup).
test_cell:
  # Encoder-count positions — from legacy locator.py
  insert_counts: [-1159, 33780, 4481, 10840]  # SAMPLE_INSERT_POS: sample at insertion depth
  test_counts:   [-1131, 33714, 4517, 14440]  # SAMPLE_TEST_POS:   sample at test position
  safe_travel_z_mm: 292.0                      # Z (mm) to raise to before/after test cell moves
  # Digital output indices (from legacy params.py ECELL_INDICES)
  piston_output_index: 2                       # hydraulic piston (on = engage/clamp)
  drain_output_index:  3                       # drain valve (on = open drain)
  # Fill/drain defaults (overridden in experiment.yaml test_cell_demo section)
  fill_pump: "H2O_ECELL"
  fill_volume_ml: 11.5                         # ECELL_VOLUME from legacy
