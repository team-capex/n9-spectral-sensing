    col_spacing_mm: 11.5
    row_spacing_mm: 5.75
    n_cols: 5
    n_rows: 18
    pick_z_mm: 40.0

  - holder_id: "holder-3"
    origin_xyz: [183.25, -82.38, 52.0]  # placeholder
