experiment_id: "pc-scan-holder3-20260410"
description: >
  10x PC samples from holder-3 locations 5-14, scanned on sensing-station-1 for 5 minutes.
  Phase 1: Home robot.
  Phase 2: Wait for PCB board to reach 40 °C.
  Phase 3: Load 10 PC samples from holder-3 onto sensing-station-1 (board-1, sensors 1-10).
  Phase 4: Start continuous spectral scanning for 5 minutes.
  Phase 5: Wait for scan to complete.
  Phase 6: Return all samples to their origin slots in holder-3.

sensing_stations:
  - sensing-station-1

sample_holders:
  - holder-3

holder_state_path: "holder_state.json"

# Sample groups.
# source: "holder"
# destination: "pcb" (spectral station) | "test_cell"
samples:
  - sample_type: "PC"
    count: 10
    source: "holder"
    destination: "pcb"
    dye_type: "dye-mixture"         # dye dispensed by add_mixture_to_pcb step

  - sample_type: "Ni"
    count: 8
    source: "holder"
    destination: "test_cell"

scanning:
  interval_minutes: 0
  total_duration_hours: 0.01
  temperature_control: true

test_cell_config:
  fill_pump: "H2O_VIAL"
  fill_volume_ml: 5.0
  drain_volume_ml: 10.0
  wait_time_s: 10.0
  drain_pump: "Drain"

# Dye mixture recipe — volumes dispensed by the fluidic stepper pump PCB.
# Calibrate water_ml / dye1_ml / dye2_ml to physical system before use.
mixture:
  water_ml: 1.0
  dye1_ml: 0.0
  dye2_ml: 0.0

steps:
  #- home_robot
  - run_test_cell_loop
  #- wait_for_pcb_temperature
  #- prime_mixture                  # move robot to waste, pump prime_volume_ml through pipette
  #- add_mixture_to_pcb 
  #- load_from_sample_holders_to_pcb
  #- start_colour_scanning
  #- wait_for_colour_scanning
  #- return_all_to_holder

output:
  cleaning_report_path: "data/cleaning_report.txt"
