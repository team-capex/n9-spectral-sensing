# experiment.yaml
# ================
# Defines one complete experiment run for the N9 spectral sensing platform.
#
# Run with:
#   experiment-run --config config.yaml --experiment experiment.yaml
#
# To resume an interrupted experiment:
#   experiment-run --config config.yaml --experiment experiment.yaml --resume

experiment_id: "demo-20260316-pc-spectral-ni-ecell"
description: >
  Demo experiment.
  Phase 1: Move 16 PC strips from the legacy sample rack into sensing-station-1
  (PCB wells pre-filled with dye manually). Start continuous spectral measurements.
  Phase 2 (concurrent): Cycle each Ni strip from the legacy rack through the
  electrochemical test cell — fill with H2O, engage piston, hold 60 s, drain,
  release piston, return to rack. Repeat for all Ni strips.

# PCB sensing stations to use (must match id values in config.yaml sensing_stations).
sensing_stations:
  - sensing-station-1

# Small white sample holders — not used in this demo (samples come from legacy rack).
sample_holders: []

# Legacy sample rack to draw PC strips and Ni strips from.
legacy_racks:
  - legacy-rack-1

# Path to the JSON file declaring the initial legacy rack slot contents.
# Edit before running to match the physical samples loaded in the rack.
legacy_rack_state_path: "legacy_rack_state.json"

# holder_state.json is not used in this demo (sample_holders is empty above),
# but the field is kept for compatibility with ExperimentRunner.
holder_state_path: "holder_state.json"

# Sample groups.
# source: legacy rack id or "holder"
# destination: "pcb" (spectral station) or "test_cell"
samples:
  - sample_type: "PC"
    count: 16
    source: "legacy-rack-1"       # pick from legacy rack
    destination: "pcb"            # place on spectral PCB (dye pre-filled)
    dye_type: ""                  # dye already in wells — no dispense step

  - sample_type: "Ni"
    count: 8                      # adjust to the number of Ni strips in the rack
    source: "legacy-rack-1"
    destination: "test_cell"      # run through electrochemical test cell

# Spectral scanning schedule.
# interval_minutes: 0  → continuous (scan as fast as possible, no sleep between scans)
# total_duration_hours: 0 → run until the Ni test cell loop finishes, then stop
scanning:
  interval_minutes: 0
  total_duration_hours: 0         # stopped when wait_for_colour_scanning is reached
  temperature_control: false      # no temperature PID for this demo

# Dye dispense is not used here (dispense_dye_to_pcb step is not in the step list).
# Kept for schema completeness.
dispense:
  volume_ul: 50.0

# Legacy test_cell_experiment field — not used in this demo (using run_ni_test_cell_loop instead).
test_cell_experiment:
  enabled: false
  protocol: "placeholder"
  samples: []

# Test cell demo configuration for the Ni-strip loop.
test_cell_demo:
  fill_pump: "H2O_ECELL"     # fill with water via the dedicated test-cell water line
  fill_volume_ml: 1.0       # full cell volume (ECELL_VOLUME from legacy)
  wait_time_s: 10.0          # hold time per Ni strip (seconds)
  drain_pump: "Drain"        # drain via the Drain peristaltic pump

# Ordered list of experiment steps.
steps:
  - home_robot                   # home robot arm

  - load_from_legacy_rack_to_pcb # move 16 PC strips → sensing-station-1 (dye already in wells)

  - start_colour_scanning        # start continuous spectral measurements in background thread

  - run_ni_test_cell_loop        # cycle all Ni strips through test cell (fill→piston→60s→drain→return)

  - wait_for_colour_scanning     # stop scan thread (thread exits after run_ni_test_cell_loop finishes)

  - return_all_to_holder         # return PC strips from PCB back to legacy rack

  - report_cleaning_needed       # write cleaning report

# Output settings.
output:
  cleaning_report_path: "data/cleaning_report.txt"
